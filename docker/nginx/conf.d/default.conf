# Upstream configuration to PHP-FPM pool
upstream fastcgi_backend {
    server php:9000;
    keepalive 8;
}

server {
    listen 80 default_server;
    listen 8080 default_server;
    server_name _;

    set $MAGE_ROOT /var/www/html;
    set $MAGE_MODE developer;

    root $MAGE_ROOT/pub;
    index index.php;
    autoindex off;
    charset UTF-8;
    error_page 404 403 = /errors/404.php;

    # Health check endpoint for Docker / ALB / Ingress
    location = /health_check.php {
        access_log off;
        return 200 "OK\n";
    }

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Static assets delivery optimization
    location /setup {
        root $MAGE_ROOT;
        location ~ ^/setup/index.php {
            fastcgi_pass   fastcgi_backend;
            fastcgi_index  index.php;
            fastcgi_param  SCRIPT_FILENAME  $document_root$fastcgi_script_name;
            include        fastcgi_params;
        }
        location ~ ^/setup/(?!pub/). {
            deny all;
        }
    }

    location /update {
        root $MAGE_ROOT;
        location ~ ^/update/index.php {
            fastcgi_pass   fastcgi_backend;
            fastcgi_index  index.php;
            fastcgi_param  SCRIPT_FILENAME  $document_root$fastcgi_script_name;
            include        fastcgi_params;
        }
        location ~ ^/update/(?!pub/). {
            deny all;
        }
    }

    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    location /pub/ {
        location ~ ^/pub/media/(secure/)?catalog/product/[a-z0-9]/[a-z0-9]/ {
            expires 1y;
            add_header Cache-Control "public";
            try_files $uri $uri/ /get.php$is_args$args;
        }
        location ~* \.(ico|jpg|jpeg|png|gif|svg|js|css|swf|eot|ttf|otf|woff|woff2)$ {
            add_header Cache-Control "public";
            add_header X-Frame-Options "SAMEORIGIN";
            expires +1y;
            try_files $uri $uri/ /get.php$is_args$args;
        }
        location ~* \.(zip|gz|gzip|bz2|csv|xml)$ {
            expires off;
            try_files $uri $uri/ /get.php$is_args$args;
        }
        add_header X-Frame-Options "SAMEORIGIN";
    }

    location /static/ {
        # Redirect missing static resources to static.php file
        if ($MAGE_MODE = "developer") {
            rewrite ^/static/(version\d*/)?(.*)$ /static.php?resource=$2 last;
        }
        location ~* \.(ico|jpg|jpeg|png|gif|svg|js|css|swf|eot|ttf|otf|woff|woff2)$ {
            expires max;
            add_header Cache-Control "public";
            add_header Access-Control-Allow-Origin *;
            try_files $uri $uri/ /static.php?resource=$1 last;
        }
    }

    location /media/ {
        try_files $uri $uri/ /get.php$is_args$args;
        location ~ ^/media/theme_customization/.*\.xml$ {
            deny all;
        }
        location ~* \.(ico|jpg|jpeg|png|gif|svg|js|css|swf|eot|ttf|otf|woff|woff2)$ {
            expires max;
            add_header Cache-Control "public";
            try_files $uri $uri/ /get.php$is_args$args;
        }
    }

    # PHP-FPM processing
    location ~ ^/(index|get|static|errors/report|errors/404|errors/503|health_check)\.php$ {
        try_files $uri =404;
        fastcgi_pass   fastcgi_backend;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;

        fastcgi_param  PHP_FLAG  "session.auto_start=off \n suhosin.session.cryptua=off";
        fastcgi_param  PHP_VALUE "memory_limit=2048M \n max_execution_time=1800";
        fastcgi_read_timeout 1800s;
        fastcgi_connect_timeout 60s;

        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME  $document_root$fastcgi_script_name;
        fastcgi_param  MAGE_MODE $MAGE_MODE;
        include        fastcgi_params;
    }

    # Deny access to sensitive files
    location ~* ^/(app|bin|var|generated|vendor)/ {
        deny all;
    }

    location ~ /\. {
        deny all;
    }
}
