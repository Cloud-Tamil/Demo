name: CI Pipeline - Validation & Security

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-validate:
    name: PHP Syntax, Lint & Composer Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: bcmath, gd, intl, pdo_mysql, soap, sockets, sodium, xsl, zip

      - name: Validate composer.json
        run: composer validate --strict

      - name: Run PHP Syntax Check (Lint)
        run: find app/code -type f -name "*.php" -exec php -l {} \;

      - name: Trivy Filesystem Vulnerability Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

  docker-build-test:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: lint-and-validate

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build PHP Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/php/Dockerfile
          push: false
          tags: magento2-application-php:ci-test

      - name: Build Nginx Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/nginx/Dockerfile
          push: false
          tags: magento2-application-nginx:ci-test
